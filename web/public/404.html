<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found, Tearsheet</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#E6E9E8" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;800&display=swap" />
    <!-- Served by the API's static files for any unknown path, so it carries its own styles. -->
    <style>
      :root { color-scheme: light; --bg: #e6e9e8; --ink: #111416; --muted: #4a5257; --stamp: #c2142f; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        align-content: center;
        gap: 24px;
        padding: 48px clamp(16px, 2.8vw, 40px);
        background: var(--bg);
        color: var(--ink);
        font: 400 18px/1.55 "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
      }
      p { margin: 0; }
      h1 { margin: 0 0 0 -0.04em; max-width: 9em; font: 800 clamp(48px, 9vw, 128px)/0.92 "Libre Franklin", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.045em; text-wrap: balance; }
      .lead { max-width: 36ch; font-size: clamp(20px, 1.6vw, 24px); line-height: 1.35; }
      a { justify-self: start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; background: var(--stamp); color: #fff; font-weight: 600; text-decoration: none; border-radius: 2px; }
      a:focus-visible { outline: 3px solid var(--stamp); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <h1>No ticket at this address</h1>
    <p class="lead">The page you asked for is not part of the January 2026 backtest. The day picker and the ticket are on the front page.</p>
    <a href="/">Back to the day picker</a>
  </body>
</html>
