<!doctype html>
<html lang="en" data-view="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tearsheet</title>
    <meta name="description" content="The GB day-ahead wind forecast you had when the auction gate closed, with metered wind stamped across it. January 2026 backtest." />
    <meta name="theme-color" content="#E6E9E8" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var root = document.documentElement;
        // The prerendered page shows the opening view (data-view); a link to another day or gate shows it as loading until the app has that one.
        var view = (root.getAttribute("data-view") || "").split(" ");
        var q = new URLSearchParams(location.search);
        if (view[1] && ((q.get("day") || view[0]) !== view[0] || (q.get("gate") || view[1]) !== view[1])) root.classList.add("deep-link");
        // If the app script never arrives, stop saying the linked view is on its way.
        setTimeout(function () { if (!window.__app) root.classList.remove("deep-link"); }, 4000);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Libre+Franklin:wght@400;500;600;800&display=swap" />
  </head>
  <body>
    <div id="root"><!--app--></div>
    <!--initial-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
